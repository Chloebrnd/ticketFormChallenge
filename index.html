<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Conf</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
</head>

<body>

    <header>

        <img src="assets/logo-full.svg" alt="Coding Conf Logo" class="logo">
    </header>

    <img aria-hidden="true" src="assets/pattern-squiggly-line-top.svg" alt="ruban SVG" class="svg-ruban-first">
    <img aria-hidden="true" src="assets/pattern-squiggly-line-bottom-desktop.svg" alt="ruban SVG"
        class="svg-ruban-second">

    <section class="section-titles">
        <h1>Your Journey to codins Conf 2025 Starts Here!</h1>
        <h2>Secure your spot at next year's biggest coding conference.</h2>
    </section>

    <section class="form-section">
        <p class="sr-only" id="form-ticket-registration">Fill out the form below to book your tickets</p>
        <form action="traitement.php" method="POST" aria-labelledby="form-ticket-registration">
            <label for="avatar">Upload Avatar</label>
            <input type="file" id="avatar" name="avatar" accept="image/*" required>

            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="github_username">GitHub Username</label>
            <input type="text" id="github_username" name="github_username" required>

            <button type="submit">Generate My Tickets</button>
        </form>
    </section>
</body>

</html>
